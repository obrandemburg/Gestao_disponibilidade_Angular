<main class="container">
  <div class="cabecalho">
    <h1>Lista de usuáriois</h1>
    <button type="button" (click)="abrirModal()">Adicionar usuário</button>
  </div>

  <ul class="lista">
    @for (usuario of usuarios$ | async; track usuario.id) {
      <li>
        <a [routerLink]="['/usuario', usuario.id]">{{ usuario.nome }}</a>
      </li>
    } @empty {
      <li class="vazio">Nenhum usuário cadastrado.</li>
    }
  </ul>
</main>

<app-modal-novo-usuario
  [aberto]="modalAberto"
  (fechar)="fecharModal()"
  (salvar)="adicionarUsuario($event)"
></app-modal-novo-usuario>
